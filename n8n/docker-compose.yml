services:
  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - WEBHOOK_URL=${WEBHOOK_URL}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      # The image ships no Python 3, so n8n logs a warning about its internal
      # Python task runner on every start. This flag states the intent, but as
      # of n8n 2.11.2 it does NOT suppress the warning - that is upstream bug
      # n8n-io/n8n#24379. The warning is cosmetic; JavaScript nodes are fine.
      # To actually run Python code nodes, deploy an external task runner.
      - N8N_PYTHON_ENABLED=false
      # n8n sits behind exactly one reverse proxy (Traefik). Without this,
      # Express does not trust X-Forwarded-For, so express-rate-limit keys on
      # Traefik's IP instead of the real client - meaning one abusive client
      # rate-limits everyone, and it logs ERR_ERL_UNEXPECTED_X_FORWARDED_FOR
      # on every request. Safe here because n8n's port is not published, so
      # Traefik is the only possible source of that header.
      - N8N_PROXY_HOPS=1
      # Outgoing email - without these, password reset is impossible and the
      # only recovery is `n8n user-management:reset` from the CLI.
      - N8N_EMAIL_MODE=${N8N_EMAIL_MODE}
      - N8N_SMTP_HOST=${N8N_SMTP_HOST}
      - N8N_SMTP_PORT=${N8N_SMTP_PORT}
      - N8N_SMTP_SSL=${N8N_SMTP_SSL}
      - N8N_SMTP_USER=${N8N_SMTP_USER}
      - N8N_SMTP_PASS=${N8N_SMTP_PASS}
      - N8N_SMTP_SENDER=${N8N_SMTP_SENDER}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.n8n.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      - "traefik.http.routers.n8n-http.rule=Host(`${N8N_DOMAIN}`)"
      - "traefik.http.routers.n8n-http.entrypoints=web"
      - "traefik.http.middlewares.n8n-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.n8n-http.middlewares=n8n-https-redirect"

volumes:
  n8n_data:

networks:
  proxy:
    external: true
