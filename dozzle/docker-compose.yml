services:
  dozzle:
    image: amir20/dozzle:v10.9.2
    container_name: dozzle
    restart: unless-stopped
    environment:
      # Dozzle's own login page. Users live in ./data/users.yml (bcrypt).
      # Chosen over Traefik BasicAuth because it gives a real session cookie
      # instead of a browser auth prompt.
      - DOZZLE_AUTH_PROVIDER=simple
      - DOZZLE_AUTH_TTL=48h
    volumes:
      # Read-only: Dozzle only ever reads container metadata and log streams.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data:/data
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.dozzle.rule=Host(`${DOZZLE_DOMAIN}`)"
      - "traefik.http.routers.dozzle.entrypoints=websecure"
      - "traefik.http.routers.dozzle.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dozzle.service=dozzle"
      - "traefik.http.services.dozzle.loadbalancer.server.port=8080"
      - "traefik.http.routers.dozzle-http.rule=Host(`${DOZZLE_DOMAIN}`)"
      - "traefik.http.routers.dozzle-http.entrypoints=web"
      - "traefik.http.middlewares.dozzle-https.redirectscheme.scheme=https"
      - "traefik.http.routers.dozzle-http.middlewares=dozzle-https"

networks:
  proxy:
    external: true
